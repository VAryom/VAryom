<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYUNIX</title>

    <link rel="icon" type="image/png" href="logogo.png">
    <link rel="stylesheet" href="apariencia 1.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --negro: #09090d;
            --oscuro: #121218;
            --gris: #1c1c26;
            --gris-claro: #c5c5d0;
            --blanco: #f5f3fa;
            --purpura: #9b5cff;
            --purpura-claro: #bd91ff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            margin: 0;
            background: var(--negro);
            color: var(--blanco);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* BARRA DE NAVEGACIÓN */
        #Navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(12, 12, 18, 0.96) !important;
            border-bottom: 1px solid rgba(155, 92, 255, 0.35);
            backdrop-filter: blur(12px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
        }

        .navbar .container {
            min-height: 70px;
        }

        .navbar-brand {
            color: var(--blanco) !important;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .navbar-brand i {
            color: var(--purpura);
            margin-right: 7px;
        }

        .navbar-nav {
            margin-left: auto;
            gap: 7px;
        }

        .navbar .nav-link {
            color: #c7c5d0 !important;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 12px 13px !important;
            border-radius: 8px;
            transition: 0.25s ease;
        }

        .navbar .nav-link:hover {
            color: white !important;
            background: rgba(155, 92, 255, 0.15);
        }

        .navbar-toggler {
            border-color: #55505f;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.25);
        }

        /* BANNER: CONSERVADO */
        .image {
            width: 100%;
            height: 640px;
            background-image: url('banner.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* SECCIÓN DE ACCIONES */
        #notas {
            padding-top: 35px;
            padding-bottom: 55px;
        }

        .titulo-seccion {
            text-align: center;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .titulo-seccion span {
            color: var(--purpura);
        }

        .subtitulo {
            color: var(--gris-claro);
            text-align: center;
            font-size: 15px;
            margin-bottom: 42px;
        }

        .acciones-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .accion-card {
            position: relative;
            overflow: hidden;
            background: var(--oscuro);
            border: 1px solid #292733;
            border-radius: 16px;
            padding: 12px;
            transition: transform 0.3s ease,
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .accion-card:hover {
            transform: translateY(-6px);
            border-color: var(--purpura);
            box-shadow: 0 12px 35px rgba(115, 55, 210, 0.17);
        }

        .accion-card img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--gris);
        }

        .accion-contenido {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 17px 8px 7px;
        }

        .accion-contenido h2 {
            color: var(--blanco);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 0;
        }

        .btn-accion {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 10px 17px;
            border: 1px solid var(--purpura);
            border-radius: 8px;
            background: var(--purpura);
            color: white;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .btn-accion:hover {
            background: transparent;
            color: var(--purpura-claro);
            border-color: var(--purpura-claro);
        }

        /* PIE DE PÁGINA */
        #pie {
            margin-top: 20px;
            padding: 28px 15px;
            background: #101016;
            border-top: 1px solid #292733;
            color: #aaa6b7;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
        }

        #pie p {
            margin: 0;
        }

        #pie span {
            color: var(--purpura-claro);
        }

        /* ADAPTACIÓN A CELULARES */
        @media (max-width: 768px) {
            .navbar-nav {
                padding: 12px 0;
                gap: 2px;
            }

            .navbar .nav-link {
                padding: 12px !important;
            }

            .image {
                height: 640px;
            }

            #notas {
                padding-top: 20px;
            }

            .acciones-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .accion-card img {
                height: auto;
                aspect-ratio: 16 / 7;
            }

            .titulo-seccion {
                letter-spacing: 2px;
            }
        }

        @media (max-width: 400px) {
            .accion-contenido h2 {
                font-size: 14px;
            }

            .btn-accion {
                padding: 9px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark" id="Navbar">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="fas fa-brain"></i> BYUNIX
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#notas">INICIO</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="indexx.html">MISIÓN</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="indexxx.html">VISIÓN</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="indexxxx.html">SERVICIO</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="indexxxxx.html">CONTACTO</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="indez.html">MÁS</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- BANNER: SIN CAMBIOS -->
    <section id="inicio">
        <div class="image">
            <img src="banener.png"
                style="width: 100%; height: 640px; object-fit: cover;">
        </div>
    </section>

    <!-- ACCIONES -->
    <section id="notas" class="container">

        <h1 class="titulo-seccion">
            NUESTRAS <span>ACCIONES</span>
        </h1>

        <p class="subtitulo">
            Conoce más sobre BYUNIX y todo lo que tenemos para ofrecerte.
        </p>

        <div class="acciones-grid">

            <article class="accion-card">
                <img src="mision.png" alt="Misión de BYUNIX" loading="lazy">
                <div class="accion-contenido">
                    <h2>MISIÓN</h2>
                    <a class="btn-accion" href="indexx.html">
                        Ver más <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </article>

            <article class="accion-card">
                <img src="vision.png" alt="Visión de BYUNIX" loading="lazy">
                <div class="accion-contenido">
                    <h2>VISIÓN</h2>
                    <a class="btn-accion" href="indexxx.html">
                        Ver más <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </article>

            <article class="accion-card">
                <img src="servicio.png" alt="Servicios de BYUNIX" loading="lazy">
                <div class="accion-contenido">
                    <h2>SERVICIOS</h2>
                    <a class="btn-accion" href="indexxxx.html">
                        Ver más <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </article>

            <article class="accion-card">
                <img src="contacto.png" alt="Contacto de BYUNIX" loading="lazy">
                <div class="accion-contenido">
                    <h2>CONTACTO</h2>
                    <a class="btn-accion" href="indexxxxx.html">
                        Ver más <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </article>

        </div>
    </section>

    <!-- PIE DE PÁGINA -->
    <footer id="pie">
        <p>TODOS LOS DERECHOS PA MI <span> :] </span></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="funcion.js"></script>

</body>
</html>
