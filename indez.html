<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYUNIX - Nosotros</title>

    <link rel="stylesheet" href="apariencia 1.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <style>
        :root {
            --negro: #09090d;
            --oscuro: #121218;
            --gris: #1c1c26;
            --gris-claro: #c5c5d0;
            --blanco: #f5f3fa;
            --purpura: #9b5cff;
            --purpura-claro: #bd91ff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            margin: 0;
            background: var(--negro);
            color: var(--blanco);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* BARRA DE NAVEGACIÓN */
        #Navbar {
            background: var(--oscuro);
        }

        #Navbar .navbar-brand {
            color: var(--purpura-claro);
        }

        #Navbar .nav-link {
            color: var(--gris-claro);
        }

        #Navbar .nav-link:hover {
            color: var(--purpura);
        }

        #Navbar .navbar-toggler {
            border-color: #393044;
        }

        /* BANNER ORIGINAL */
        .image {
            width: 100%;
            height: 640px;
            background-image: url('banner.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .image img {
            width: 100%;
            height: 640px;
            object-fit: cover;
        }

        /* SECCIÓN NOSOTROS */
        #holaa {
            padding: 20px;
            color: var(--blanco);
            text-align: center;
            font-size: clamp(30px, 4vw, 44px);
            font-weight: 900;
            letter-spacing: 4px;
        }

        .descripcion {
            max-width: 800px;
            margin: 0 auto 100px;
            padding: 30px;
            background: var(--oscuro);
            border: 1px solid #292733;
            border-radius: 16px;
            text-align: center;
        }

        .descripcion h5 {
            color: var(--purpura-claro);
            font-size: 20px;
            margin: 0;
        }

        /* PIE DE PÁGINA */
        #pie {
            margin-top: 20px;
            padding: 28px 15px;
            background: #101016;
            border-top: 1px solid #292733;
            color: #aaa6b7;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
        }

        #pie p {
            margin: 0;
        }

        #pie span {
            color: var(--purpura-claro);
        }

        @media (max-width: 768px) {
            .image,
            .image img {
                height: 640px;
            }

            #holaa {
                letter-spacing: 2px;
            }

            .descripcion {
                margin: 0 15px 70px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark" id="Navbar"
         style="position: sticky; top: 0; z-index: 1000;">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="fas fa-brain"></i> BYUNIX
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">INICIO</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#holaa">NOSOTROS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="crear.html">USTEDES</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- BANNER -->
    <section id="inicio">
        <div class="image">
            <img src="banener.png" alt="Banner de BYUNIX">
        </div>
    </section>

    <br><br>

    <!-- NOSOTROS -->
    <section class="container">
        <h1 id="holaa">NOSOTROS</h1>

        <div class="descripcion">
            <h5>Un simple estudiante de 1008</h5>
        </div>
    </section>

    <!-- PIE DE PÁGINA -->
    <footer id="pie">
        <p>TODOS LOS DERECHOS PA MI <span>:]</span></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
